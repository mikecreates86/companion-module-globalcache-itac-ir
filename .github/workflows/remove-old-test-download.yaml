name: Remove old test download

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the retired test-build pre-release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete test-build --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
